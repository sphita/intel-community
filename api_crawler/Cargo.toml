[package]
name = "api_crawler"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2.2.0"
futures = "0.3"
url = "2.5"
ratatui = "0.30.2"
crossterm = "0.29.0"
urlencoding = "2.1.3"
chrono = { version = "0.4.45", features = ["serde"] }
